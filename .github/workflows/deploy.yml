name: CI & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    name: Lint, Test & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: qr-code-app/package-lock.json

      - name: Install Dependencies
        working-directory: qr-code-app
        run: npm ci

      - name: Run Lint
        working-directory: qr-code-app
        run: npm run lint

      - name: Run Tests
        working-directory: qr-code-app
        run: npm run test

      - name: Security Audit
        working-directory: qr-code-app
        run: npm audit --audit-level=high

  deploy:
    name: Build & Deploy
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: qr-code-app/package-lock.json

      - name: Install Dependencies
        working-directory: qr-code-app
        run: npm ci

      - name: Build Application
        working-directory: qr-code-app
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: qr-code-app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4